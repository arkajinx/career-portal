<!DOCTYPE html>
<html>
<head>
    <title>Dashboard – Career Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h2>📊 Student Responses</h2>

<p>
    Logged in as <b>{{ session.teacher }}</b>
    |
    <a href="/logout">Logout</a>
</p>

<table class="dashboard-table">
<tr>
    <th>Name</th>
    <th>Class</th>
    <th>Stream</th>
    <th>Exam</th>
    <th>Date</th>
    <th>Open</th>
    <th>PDF</th>
    <th>Delete</th>
</tr>

{% for r in rows %}
<tr>
    <td>{{ r[1] }}</td>
    <td>{{ r[2] }}</td>
    <td>{{ r[3] }}</td>
    <td>{{ r[4] }}</td>
    <td>{{ r[5] }}</td>

    <!-- OPEN -->
    <td>
        <form action="/student/{{ r[0] }}" method="get" class="inline-form">
            <button type="submit" class="btn btn-open">Open</button>
        </form>
    </td>

    <!-- PDF -->
    <td>
        <form action="/report/{{ r[0] }}" method="get" class="inline-form">
            <button type="submit" class="btn btn-pdf">PDF</button>
        </form>
    </td>

    <!-- DELETE -->
    <td>
        <form action="/delete/{{ r[0] }}" method="post"
              onsubmit="return confirm('Delete this student?')"
              class="inline-form">
            <button type="submit" class="btn btn-delete">Delete</button>
        </form>
    </td>
</tr>
{% endfor %}

</table>

</body>
</html>
