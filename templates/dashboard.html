<!DOCTYPE html>
<html>
<head>
    <title>Dashboard – Career Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h2>📊 Student Submissions</h2>

<p>
    Logged in as <b>{{ session.teacher }}</b>
    |
    <a href="/logout">Logout</a>
</p>

<table>

<tr>
    <th>Name</th>
    <th>Class</th>
    <th>Stream</th>
    <th>Date</th>
    <th>View</th>
</tr>

{% for r in rows %}
<tr>
    <td>{{ r[1] }}</td>
    <td>{{ r[2] }}</td>
    <td>{{ r[3] }}</td>
    <td>{{ r[4] }}</td>
    <td>
        <a href="/student/{{ r[0] }}">Open</a>
    </td>
</tr>
{% endfor %}

</table>

</body>
</html>
